<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d5dfc" />
  <title>مين برا السالفة؟</title>
  <style>
    :root {
      --bg: #f7f7ff;
      --surface: #ffffff;
      --surface-2: #f1efff;
      --text: #17162a;
      --muted: #6d6a82;
      --primary: #6d5dfc;
      --primary-2: #8a7cff;
      --accent: #ffb84d;
      --danger: #e5484d;
      --success: #2d9d78;
      --border: #e6e3f4;
      --shadow: 0 16px 40px rgba(45, 36, 100, .12);
      --radius: 22px;
    }
    [data-theme="dark"] {
      --bg: #11101a;
      --surface: #1a1826;
      --surface-2: #242038;
      --text: #f7f5ff;
      --muted: #b9b4ca;
      --primary: #8a7cff;
      --primary-2: #a99fff;
      --accent: #ffc66d;
      --danger: #ff6b70;
      --success: #56c89f;
      --border: #332f46;
      --shadow: 0 16px 40px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.16), transparent 32%),
        radial-gradient(circle at 95% 10%, rgba(255,184,77,.16), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .app { width: min(100%, 760px); margin: 0 auto; min-height: 100vh; padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
    .brand-badge { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; box-shadow: var(--shadow); font-size: 22px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(45,36,100,.07); }
    .progress-wrap { overflow-x: auto; padding-bottom: 7px; scrollbar-width: none; margin-bottom: 12px; }
    .progress-wrap::-webkit-scrollbar { display: none; }
    .progress { display: flex; gap: 8px; min-width: max-content; }
    .step { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 999px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
    .step b { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); font-size: 12px; }
    .step.active { color: white; background: var(--primary); border-color: var(--primary); }
    .step.active b { color: var(--primary); background: white; }
    .step.done { color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, var(--border)); }
    .screen { animation: enter .28s ease both; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .hero { padding: 34px 4px 20px; text-align: center; }
    .hero-logo { width: 108px; height: 108px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 34px; background: linear-gradient(135deg, var(--primary), #a14eff); color: white; font-size: 52px; box-shadow: 0 22px 60px rgba(109,93,252,.32); transform: rotate(-4deg); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(30px, 8vw, 48px); line-height: 1.16; margin-bottom: 10px; }
    h2 { font-size: clamp(25px, 6vw, 34px); line-height: 1.25; margin-bottom: 8px; }
    h3 { font-size: 20px; margin-bottom: 8px; }
    .lead { color: var(--muted); font-size: 17px; }
    .card { background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .soft-card { background: var(--surface-2); border-radius: 18px; padding: 15px; margin-bottom: 12px; }
    .actions { display: grid; gap: 10px; margin-top: 16px; }
    .actions.two { grid-template-columns: 1fr 1fr; }
    .btn { min-height: 52px; border: 0; border-radius: 17px; padding: 12px 16px; font-weight: 800; transition: transform .15s ease, filter .15s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; box-shadow: 0 12px 26px rgba(109,93,252,.24); }
    .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--primary); border: 1px dashed color-mix(in srgb, var(--primary) 45%, var(--border)); }
    .btn.danger { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border)); }
    .btn.small { min-height: 42px; border-radius: 14px; padding: 8px 12px; font-size: 14px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-weight: 800; margin-bottom: 6px; }
    .input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 15px; padding: 13px 14px; background: var(--surface); color: var(--text); outline: none; }
    .input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 14%, transparent); }
    textarea { min-height: 130px; resize: vertical; }
    .player-row { display: grid; grid-template-columns: 1fr 44px; gap: 9px; margin-bottom: 10px; }
    .delete-btn { border: 0; border-radius: 14px; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); font-size: 18px; }
    .error { color: var(--danger); font-weight: 700; font-size: 14px; margin: 5px 2px 0; }
    .hint { color: var(--muted); font-size: 14px; }
    .notice { border-radius: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--accent) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); margin: 12px 0; }
    .counter { display: grid; grid-template-columns: 58px 1fr 58px; align-items: center; gap: 12px; margin: 18px 0; }
    .counter button { width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--surface-2); color: var(--primary); font-size: 28px; font-weight: 900; }
    .counter-value { text-align: center; font-size: 26px; font-weight: 900; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .switch-row:last-child { border-bottom: 0; }
    .switch { position: relative; width: 54px; height: 31px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: #b7b3c5; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 23px; height: 23px; right: 4px; top: 4px; border-radius: 50%; background: white; transition: .2s; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(-23px); }
    .segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .segmented button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 13px; padding: 10px 5px; font-weight: 800; }
    .segmented button.active { border-color: var(--primary); background: var(--primary); color: white; }
    .categories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .category { position: relative; min-height: 112px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 19px; padding: 15px; text-align: right; transition: .18s; }
    .category .emoji { display: block; font-size: 30px; margin-bottom: 8px; }
    .category.selected { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 13%, transparent); background: color-mix(in srgb, var(--primary) 7%, var(--surface)); }
    .category.selected:after { content: "✓"; position: absolute; left: 10px; top: 10px; width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--primary); font-weight: 900; }
    .distribution-progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 12px 0 20px; }
    .distribution-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: inherit; transition: width .3s; }
    .pass-card { text-align: center; padding: 28px 18px; }
    .person-orb { width: 98px; height: 98px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 43px; border: 4px solid color-mix(in srgb, var(--primary) 18%, var(--surface)); }
    .role-card { text-align: center; padding: 26px 18px; overflow: hidden; position: relative; }
    .role-card.normal { background: linear-gradient(145deg, color-mix(in srgb, var(--success) 13%, var(--surface)), var(--surface)); }
    .role-card.imposter { background: linear-gradient(145deg, color-mix(in srgb, var(--danger) 13%, var(--surface)), var(--surface)); }
    .secret-word { margin: 16px auto; padding: 17px; border-radius: 18px; background: var(--surface); border: 2px dashed var(--primary); font-size: 30px; font-weight: 900; word-break: break-word; }
    .matchup { text-align: center; padding: 26px 15px; }
    .matchup-line { font-size: clamp(29px, 8vw, 44px); font-weight: 900; line-height: 1.35; margin: 22px 0; }
    .versus { display: grid; grid-template-columns: 1fr 58px 1fr; align-items: center; gap: 8px; }
    .player-chip { padding: 16px 8px; border-radius: 18px; background: var(--surface-2); font-size: 18px; font-weight: 900; overflow-wrap: anywhere; }
    .vs { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: white; font-weight: 900; }
    .timer { width: 94px; height: 94px; margin: 16px auto; display: grid; place-items: center; border-radius: 50%; border: 7px solid color-mix(in srgb, var(--primary) 25%, var(--border)); font-size: 28px; font-weight: 900; }
    .timer.ending { border-color: var(--danger); color: var(--danger); animation: pulse .7s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.05); } }
    .tips ul { margin: 0; padding-right: 20px; }
    .tips li { margin: 6px 0; }
    .vote-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .vote-option { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 17px; min-height: 72px; padding: 12px; font-weight: 900; }
    .vote-option.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent); }
    .reveal { text-align: center; padding: 26px 15px; }
    .truth { font-size: 36px; font-weight: 900; margin: 18px 0; }
    .result-banner { text-align: center; border-radius: 24px; padding: 24px 16px; margin-bottom: 15px; background: linear-gradient(135deg, var(--primary), #a14eff); color: white; box-shadow: 0 18px 42px rgba(109,93,252,.28); }
    .result-banner.win-imposter { background: linear-gradient(135deg, #d83f55, #7b2cbf); }
    .result-banner.chaos { background: linear-gradient(135deg, #ff9f1c, #f15bb5); }
    .score-table { width: 100%; border-collapse: collapse; }
    .score-table th, .score-table td { padding: 11px 8px; text-align: right; border-bottom: 1px solid var(--border); }
    .score-table tr:last-child td { border-bottom: 0; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; font-size: 12px; font-weight: 900; background: var(--surface-2); }
    .badge.imposter { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
    .badge.normal { color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
    .back-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { border: 0; background: transparent; color: var(--primary); font-weight: 900; padding: 8px; }
    .toast { position: fixed; right: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(50%, 18px); background: #1c1b24; color: white; padding: 11px 16px; border-radius: 14px; box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 28px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(50%, 0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(12,10,24,.58); display: grid; place-items: end center; padding: 14px; animation: fade .2s; }
    @media (min-width: 650px) { .modal-backdrop { place-items: center; } }
    @keyframes fade { from { opacity: 0; } }
    .modal { width: min(100%, 520px); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 25px; padding: 20px; box-shadow: 0 30px 90px rgba(0,0,0,.35); animation: up .22s; }
    @keyframes up { from { transform: translateY(20px); opacity: 0; } }
    .privacy-shield { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
    .privacy-icon { font-size: 58px; }
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
    .confetti i { position: absolute; top: -20px; width: 10px; height: 18px; border-radius: 3px; animation: fall var(--d) linear forwards; transform: rotate(var(--r)); background: hsl(var(--h) 80% 58%); }
    @keyframes fall { to { transform: translate3d(var(--x), 110vh, 0) rotate(760deg); } }
    .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
    .hidden { display: none !important; }
    @media (max-width: 390px) {
      .actions.two { grid-template-columns: 1fr; }
      .categories, .vote-grid { grid-template-columns: 1fr; }
      .segmented { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

          ],
          settings: {
            imposterCount: 1,
            allImposters: false,
            randomCategory: true,
            sound: true,
            vibration: true,
            theme: 'light',
            pointsEnabled: true,
            allowSelfVote: false,
            voteMode: 'one',
            questionTimer: 30,
            discussionMinutes: 2
          },
          selectedCategoryIds: [],
          customCategories: [],
          previousWords: [],
          round: null,
          privacyShield: false
        };
      }

      let state = loadState();
      let secret = loadSecret();
      let timerHandle = null;
      let timerRemaining = 0;
      let deferredInstallPrompt = null;

      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!parsed || !Array.isArray(parsed.players)) return defaultState();
          const base = defaultState();
          const restored = {
            ...base,
            ...parsed,
            settings: { ...base.settings, ...(parsed.settings || {}) },
            players: parsed.players.map(p => ({ id: p.id || makeId(), name: p.name || '', score: Number(p.score || 0) })),
            customCategories: Array.isArray(parsed.customCategories) ? parsed.customCategories : [],
            selectedCategoryIds: Array.isArray(parsed.selectedCategoryIds) ? parsed.selectedCategoryIds : [],
            previousWords: Array.isArray(parsed.previousWords) ? parsed.previousWords : []
          };
          if (restored.screen === 'roles' && restored.round?.roleRevealed) {
            restored.round.roleRevealed = false;
            restored.privacyShield = true;
          }
          return restored;
        } catch { return defaultState(); }
      }

      function encodeSecret(obj) {
        const raw = encodeURIComponent(JSON.stringify(obj));
        const key = 'salfa-2026';
        let out = '';
        for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        return btoa(out);
      }
      function decodeSecret(text) {
        const key = 'salfa-2026';
        const raw = atob(text);
        let out = '';
        for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        return JSON.parse(decodeURIComponent(out));
      }
      function saveSecret() {
        try { localStorage.setItem(SECRET_KEY, encodeSecret(secret || {})); } catch {}
      }
      function loadSecret() {
        try {
          const raw = localStorage.getItem(SECRET_KEY);
          return raw ? decodeSecret(raw) : {};
        } catch { return {}; }
      }
      function saveState() {
        try {
          const safe = { ...state, privacyShield: false };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
          saveSecret();
        } catch {}
      }
      function setState(patch, renderNow = true) {
        state = typeof patch === 'function' ? patch(state) : { ...state, ...patch };
        saveState();
        if (renderNow) render();
      }

      function feedback(kind = 'tap') {
        if (state.settings.vibration && navigator.vibrate) navigator.vibrate(kind === 'big' ? [30,25,35] : 18);
        if (!state.settings.sound) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = kind === 'big' ? 'triangle' : 'sine';
          osc.frequency.value = kind === 'error' ? 180 : kind === 'big' ? 640 : 420;
          gain.gain.setValueAtTime(.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.08, ctx.currentTime + .01);
          gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .11);
          osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + .12);
        } catch {}
      }

      function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('show'), 2600);
      }

      function showModal({ title, body, confirmText = 'تمام', cancelText = 'الغاء', onConfirm, hideCancel = false }) {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="modal">
              <h3>${escapeHtml(title)}</h3>
              <div>${body}</div>
              <div class="actions two">
                ${hideCancel ? '' : `<button class="btn secondary" data-modal-cancel>${escapeHtml(cancelText)}</button>`}
                <button class="btn primary" data-modal-confirm>${escapeHtml(confirmText)}</button>
              </div>
            </div>
          </div>`;
        root.querySelector('[data-modal-cancel]')?.addEventListener('click', () => root.innerHTML = '');
        root.querySelector('[data-modal-confirm]')?.addEventListener('click', () => {
          const shouldClose = onConfirm ? onConfirm(root) : true;
          if (shouldClose !== false) root.innerHTML = '';
        });
      }

      function allCategories() { return [...categories, ...state.customCategories]; }
      function getCategory(id) { return allCategories().find(c => c.id === id); }
      function currentPlayerById(id) { return state.players.find(p => p.id === id); }
      function maxImposters() { return Math.max(1, Math.min(3, state.players.length - 1)); }
      function validPlayers() {
        const names = state.players.map(p => normalizeName(p.name));
        const lowered = names.map(n => n.toLocaleLowerCase('ar'));
        return state.players.length >= MIN_PLAYERS && state.players.length <= MAX_PLAYERS && names.every(Boolean) && new Set(lowered).size === names.length;
      }
      function playerErrors() {
        const names = state.players.map(p => normalizeName(p.name));
        if (names.some(n => !n)) return 'فيه اسم فاضي، عبوه وبعدين كملوا.';
        if (new Set(names.map(n => n.toLocaleLowerCase('ar'))).size !== names.length) return 'فيه اسم مكرر، غيروه عشان ما نلخبط.';
        return '';
      }

      const steps = [
        ['players','اللاعبون'], ['settings','الاعدادات'], ['categories','التصنيف'], ['roles','توزيع الادوار'],
        ['questions','الاسئلة'], ['voting','التصويت'], ['result','النتيجة']
      ];
      function screenStep(screen) {
        if (['home'].includes(screen)) return -1;
        if (['players'].includes(screen)) return 0;
        if (['settings'].includes(screen)) return 1;
        if (['categories'].includes(screen)) return 2;
        if (['roles'].includes(screen)) return 3;
        if (['questions','discussion'].includes(screen)) return 4;
        if (['voting','guess'].includes(screen)) return 5;
        if (['result'].includes(screen)) return 6;
        return 0;
      }
      function progressHtml() {
        const current = screenStep(state.screen);
        if (current < 0) return '';
        return `<div class="progress-wrap" aria-label="مراحل اللعبة"><div class="progress">${steps.map((s,i) => `<div class="step ${i === current ? 'active' : i < current ? 'done' : ''}"><b>${i+1}</b>${s[1]}</div>`).join('')}</div></div>`;
      }
      function topbarHtml() {
        return `<div class="topbar">
          <div class="brand"><span class="brand-badge">🕵️</span><span>مين برا السالفة؟</span></div>
          <div class="top-actions">
            <button class="icon-btn" data-action="toggle-sound" aria-label="تشغيل او ايقاف الصوت">${state.settings.sound ? '🔊' : '🔇'}</button>
            <button class="icon-btn" data-action="toggle-theme" aria-label="تغيير الوضع">${state.settings.theme === 'dark' ? '☀️' : '🌙'}</button>
          </div>
        </div>`;
      }
      function backRow(title, backAction = 'back') {
        return `<div class="back-row"><button class="back" data-action="${backAction}">→ رجوع</button><span class="badge">${escapeHtml(title)}</span></div>`;
      }

      function render() {
        stopTimer();
        document.documentElement.dataset.theme = state.settings.theme;
        document.querySelector('meta[name="theme-color"]').content = state.settings.theme === 'dark' ? '#11101a' : '#6d5dfc';
        const app = document.getElementById('app');
        let body = '';
        switch (state.screen) {
          case 'home': body = renderHome(); break;
          case 'players': body = renderPlayers(); break;
          case 'settings': body = renderSettings(); break;
          case 'categories': body = renderCategories(); break;
          case 'roles': body = renderRoles(); break;
          case 'questions': body = renderQuestions(); break;
          case 'discussion': body = renderDiscussion(); break;
          case 'voting': body = renderVoting(); break;
          case 'guess': body = renderGuess(); break;
          case 'result': body = renderResult(); break;
          default: state.screen = 'home'; body = renderHome();
        }
        app.innerHTML = `${topbarHtml()}${progressHtml()}<section class="screen">${body}</section><div class="footer-note">اللعبة تشتغل محليا على جهازك وما تحتاج تسجيل دخول</div>`;
        bindGlobalActions();
        bindScreenActions();
        renderPrivacyShield();
        if (state.screen === 'questions' && state.round?.questionPhase === 'active') startQuestionTimer();
        if (state.screen === 'discussion' && state.round?.discussionRunning) startDiscussionTimer();
      }

      function renderHome() {
        const hasSavedRound = state.round?.started && !state.round?.resultWinner;

      }

      function renderPlayers() {
        const err = playerErrors();
        return `${backRow('1 من 7', 'home')}
          <h2>مين بيلعب معنا؟</h2>
          <p class="lead">اكتبوا الاسامي وخلو كل واحد يعرف دوره بعدين.</p>
          <div class="card">
            <div id="players-list">${state.players.map((p,i) => `

                <input class="input" maxlength="24" value="${escapeHtml(p.name)}" data-player-input="${p.id}" aria-label="اسم اللاعب ${i+1}" placeholder="اسم اللاعب ${i+1}" />

            <div class="actions two">

      function renderSettings() {
        const maxImp = maxImposters();
        const unavailable = state.settings.allImposters;
        return `${backRow('2 من 7')}
          <h2>كم امبوستر في الجولة؟</h2>

            <div class="switch-row">
              <div><b>وضع الجميع امبوستر</b><div class="hint">ما احد ياخذ الكلمة، وكل واحد يحاول يفهم السالفة من الحوار.</div></div>
              <label class="switch"><input type="checkbox" data-setting="allImposters" ${state.settings.allImposters ? 'checked' : ''}><span class="slider"></span></label>

            </div>
            <div class="switch-row">
              <div><b>نظام النقاط</b><div class="hint">نجمع النقاط بين الجولات ونطلع الترتيب.</div></div>
              <label class="switch"><input type="checkbox" data-setting="pointsEnabled" ${state.settings.pointsEnabled ? 'checked' : ''}><span class="slider"></span></label>
            </div>
            <div class="switch-row">
              <div><b>السماح بالتصويت للنفس</b><div class="hint">مقفلة افتراضيا عشان التصويت يكون منطقي.</div></div>
              <label class="switch"><input type="checkbox" data-setting="allowSelfVote" ${state.settings.allowSelfVote ? 'checked' : ''}><span class="slider"></span></label>
            </div>
          </div>
          <div class="card">
            <h3>طريقة التصويت</h3>
            <select data-setting-select="voteMode" ${state.settings.allImposters ? 'disabled' : ''}>
              <option value="one" ${state.settings.voteMode === 'one' ? 'selected' : ''}>كل لاعب يصوت لشخص واحد</option>
              <option value="all" ${state.settings.voteMode === 'all' ? 'selected' : ''}>كل لاعب يختار بعدد الامبوسترات</option>
            </select>
            <h3 style="margin-top:18px">وقت كل سؤال</h3>
            <div class="segmented">${[0,15,30,45].map(v => `<button data-question-time="${v}" class="${state.settings.questionTimer === v ? 'active' : ''}">${v === 0 ? 'بدون' : `${v} ث`}</button>`).join('')}</div>
            <h3 style="margin-top:18px">مدة النقاش العام</h3>
            <select data-setting-select="discussionMinutes">${[1,2,3,4,5].map(v => `<option value="${v}" ${state.settings.discussionMinutes === v ? 'selected' : ''}>${v} ${v === 1 ? 'دقيقة' : 'دقايق'}</option>`).join('')}</select>
            ${state.settings.pointsEnabled ? `<button class="btn danger small" style="width:100%;margin-top:15px" data-action="reset-scores">صفر كل النقاط</button>` : ''}

      function renderCategories() {
        const list = allCategories();
        return `${backRow('3 من 7')}
          <h2>اختر تصنيف الجولة</h2>
          <p class="lead">تقدر تختار اكثر من تصنيف، واحنا نسحب واحد منهم.</p>
          <div class="card">
            <div class="switch-row">
              <div><b>اختيار عشوائي</b><div class="hint">كل جولة نسحب من التصنيفات اللي اخترتها، او من الكل اذا ما اخترت شي.</div></div>
              <label class="switch"><input type="checkbox" data-setting="randomCategory" ${state.settings.randomCategory ? 'checked' : ''}><span class="slider"></span></label>

          <div class="actions">
            <button class="btn ghost" data-action="custom-category">+ اضافة تصنيف خاص</button>
            <button class="btn primary" data-action="start-roles">ابدأ توزيع الادوار</button>
          </div>`;
      }

      function startRound() {
        if (!validPlayers()) { state.screen = 'players'; render(); return; }
        const available = allCategories();
        let pool = state.selectedCategoryIds.map(getCategory).filter(Boolean);
        if (!pool.length) pool = available;
        const pickedCategory = sample(pool);
        const recent = new Set(state.previousWords.slice(-8));
        let wordPool = pickedCategory.words.filter(w => !recent.has(w));
        if (!wordPool.length) wordPool = pickedCategory.words;
        const pickedWord = sample(wordPool);
        const order = shuffle(state.players.map(p => p.id));
        const imposterIds = state.settings.allImposters ? [...order] : shuffle(order).slice(0, clamp(state.settings.imposterCount,1,maxImposters()));
        secret = { word: pickedWord, imposterIds };
        state.previousWords = [...state.previousWords, pickedWord].slice(-20);
        state.round = {
          id: makeId(),
          started: true,
          categoryId: pickedCategory.id,
          categoryName: pickedCategory.name,
          distributionOrder: order,
          roleIndex: 0,
          roleRevealed: false,
          allRolesSeen: false,
          pairings: [],
          usedPairs: [],
          questionIndex: 0,
          questionRound: 1,
          questionPhase: 'ready',
          votes: {},
          voterOrder: shuffle(state.players.map(p => p.id)),
          voterIndex: 0,
          voteStarted: false,
          currentVote: [],
          voteRestriction: null,
          tieCandidates: [],
          tiePending: false,
          revoteContext: null,
          finalTally: {},
          detected: false,
          topSuspects: [],
          guessIndex: 0,
          guesses: {},
          guessedCorrectly: false,
          pointsApplied: false,
          resultWinner: null,
          discussionRunning: false,
          discussionRemaining: state.settings.discussionMinutes * 60
        };
        state.screen = 'roles';
        history.pushState({gameGuard:true}, '', location.href);
        saveState();
        feedback('big');
        render();
      }

      function renderRoles() {
        if (!state.round || !secret.imposterIds) return `<div class="card"><p>ما لقينا بيانات الجولة.</p><button class="btn primary" data-action="go-categories">ارجع للتصنيفات</button></div>`;
        const r = state.round;
        const total = r.distributionOrder.length;
        const idx = r.roleIndex;
        const pct = r.allRolesSeen ? 100 : Math.round((idx / total) * 100);
        if (r.allRolesSeen) {
          return `${backRow('4 من 7', 'locked-back')}<div class="distribution-progress"><span style="width:100%"></span></div>
            <div class="card pass-card"><div class="person-orb">✅</div><h2>الجميع عرف دوره</h2><p class="lead">الحين خلوا الجوال بالنص وابدوا السوالف.</p><button class="btn primary" style="width:100%" data-action="begin-questions">ابدأ الجولة</button></div>`;
        }
        const playerId = r.distributionOrder[idx];
        const player = currentPlayerById(playerId);
        const isImp = secret.imposterIds.includes(playerId);
        const progress = `<div class="distribution-progress" aria-label="تقدم توزيع الادوار"><span style="width:${pct}%"></span></div><div class="hint" style="text-align:center;margin-top:-12px;margin-bottom:14px">اللاعب ${idx+1} من ${total}</div>`;
        if (!r.roleRevealed) {
          return `${backRow('4 من 7', 'locked-back')}${progress}<div class="card pass-card">
            <div class="person-orb">🙈</div><h2>عط الجوال لـ ${escapeHtml(player.name)}</h2><p class="lead">تاكد ان ما احد يشوف الشاشة غيره.</p>
            <button class="btn primary" style="width:100%" data-action="reveal-role">انا ${escapeHtml(player.name)}، اعرض دوري</button>
          </div>`;
        }
        const allImpText = `<h2>انت برا السالفة 🕵️</h2><p class="lead">ما احد يعرف الكلمة في هالجولة. حاولوا تكتشفون الموضوع من الحوار.</p>`;
        const impText = `<h2>انت برا السالفة 🕵️</h2><p><b>التصنيف: ${escapeHtml(r.categoryName)}</b></p><p class="lead">حاول تعرف الكلمة من الاسئلة والاجابات بدون ما ينكشف وضعك.</p>`;
        const normalText = `<h2>انت داخل السالفة ✅</h2><p><b>التصنيف: ${escapeHtml(r.categoryName)}</b></p><div class="secret-word">${escapeHtml(secret.word)}</div><p class="lead">احفظ الكلمة ولا تقولها بشكل مباشر.</p>`;
        return `${backRow('4 من 7', 'locked-back')}${progress}<div class="card role-card ${isImp ? 'imposter' : 'normal'}">${state.settings.allImposters ? allImpText : isImp ? impText : normalText}<button class="btn primary" style="width:100%" data-action="hide-role">فهمت، اخف دوري</button></div>`;
      }

      function generateFairPairings(roundNumber = 1) {
        const ids = state.players.map(p => p.id);
        if (ids.length === 2) return [{asker:ids[0],target:ids[1]},{asker:ids[1],target:ids[0]}];
        const used = new Set(state.round.usedPairs || []);
        let best = null;
        let bestScore = Infinity;
        for (let attempt = 0; attempt < 500; attempt++) {
          const askers = shuffle(ids);
          const shift = 1 + Math.floor(Math.random() * (ids.length - 1));
          const baseTargets = askers.map((_,i) => askers[(i + shift) % askers.length]);
          const pairs = askers.map((asker,i) => ({ asker, target: baseTargets[i] }));
          if (pairs.some(p => p.asker === p.target)) continue;
          let score = 0;
          pairs.forEach(p => { if (used.has(`${p.asker}>${p.target}`)) score += 8; });
          for (let i=1;i<pairs.length;i++) {
            const a = pairs[i-1], b = pairs[i];
            if (a.asker === b.asker || a.asker === b.target || a.target === b.asker || a.target === b.target) score += 1;
          }
          score += Math.random();
          if (score < bestScore) { best = pairs; bestScore = score; }
        }
        return best || ids.map((id,i) => ({ asker:id, target:ids[(i+1)%ids.length] }));
      }

      function beginQuestions(extra = false) {
        const pairs = generateFairPairings(extra ? state.round.questionRound + 1 : 1);
        state.round.pairings = pairs;
        state.round.questionIndex = 0;
        state.round.questionPhase = 'active';
        state.round.questionRound = extra ? state.round.questionRound + 1 : 1;
        state.screen = 'questions';
        saveState();
        render();
      }

      function renderQuestions() {
        const r = state.round;
        if (!r?.pairings?.length) return `<div class="card"><p>جاهزين نرتب الاسئلة؟</p><button class="btn primary" data-action="begin-questions">رتب الاسئلة</button></div>`;
        if (r.questionPhase === 'complete') {
          return `${backRow('5 من 7', 'locked-back')}<div class="card pass-card"><div class="person-orb">💬</div><h2>خلصت جولة الاسئلة</h2><p class="lead">تبون زيادة ولا ندخل بالنقاش والتصويت؟</p>
            <div class="actions"><button class="btn secondary" data-action="extra-questions">جولة اسئلة زيادة</button><button class="btn primary" data-action="start-discussion">ابدأ النقاش العام</button><button class="btn ghost" data-action="go-voting">روحوا للتصويت على طول</button></div></div>`;
        }
        const pair = r.pairings[r.questionIndex];
        const asker = currentPlayerById(pair.asker);
        const target = currentPlayerById(pair.target);
        return `${backRow('5 من 7', 'locked-back')}
          <div class="card matchup">
            <div class="badge">الجولة ${r.questionRound}</div>
            <p class="hint" style="margin-top:10px">السؤال ${r.questionIndex+1} من ${r.pairings.length}</p>
            <div class="versus"><div class="player-chip">${escapeHtml(asker.name)}<div class="hint">يسال</div></div><div class="vs">VS</div><div class="player-chip">${escapeHtml(target.name)}<div class="hint">يجاوب</div></div></div>
            ${state.settings.questionTimer ? `<div id="timer" class="timer">${state.settings.questionTimer}</div>` : `<div class="notice">بدون مؤقت، خذوا راحتكم بس لا تطولونها 😄</div>`}
            <div class="actions two"><button class="btn secondary" data-action="skip-match">تخطي المواجهة</button><button class="btn primary" data-action="next-question">السؤال التالي</button></div>
          </div>
          <div class="soft-card tips"><h3>نصايح سريعة</h3><ul><li>اسال شي له علاقة بالكلمة بدون ما تقولها.</li><li>لا تخلي سؤالك مباشر مرة.</li><li>راقب التردد والتناقض بالاجابات.</li></ul></div>`;
      }

      function startQuestionTimer() {
        const seconds = Number(state.settings.questionTimer || 0);
        if (!seconds) return;
        timerRemaining = seconds;
        const el = document.getElementById('timer');
        if (!el) return;
        el.textContent = timerRemaining;
        timerHandle = setInterval(() => {
          timerRemaining--;
          const current = document.getElementById('timer');
          if (!current) return stopTimer();
          current.textContent = Math.max(0,timerRemaining);
          current.classList.toggle('ending', timerRemaining <= 5);
          if (timerRemaining <= 0) { stopTimer(); feedback('big'); toast('خلص الوقت، يلا على السؤال اللي بعده'); }
        },1000);
      }
      function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }

      function skipCurrentMatch() {
        const r = state.round;
        const i = r.questionIndex;
        const current = r.pairings[i];
        let swapped = false;
        for (let j = i + 1; j < r.pairings.length; j++) {
          const other = r.pairings[j];
          const aTarget = other.target;
          const bTarget = current.target;
          if (current.asker !== aTarget && other.asker !== bTarget) {
            const newA = `${current.asker}>${aTarget}`;
            const newB = `${other.asker}>${bTarget}`;
            if (!r.usedPairs.includes(newA) && !r.usedPairs.includes(newB)) {
              current.target = aTarget;
              other.target = bTarget;
              swapped = true;
              break;
            }
          }
        }
        if (!swapped) toast('ما لقينا تبديل عادل، خلوا هالمواجهة تمشي');
        else { feedback(); saveState(); render(); }
      }

      function startDiscussion() {
        state.round.discussionRemaining = state.settings.discussionMinutes * 60;
        state.round.discussionRunning = true;
        state.screen = 'discussion';
        saveState(); render();
      }
      function renderDiscussion() {
        const s = state.round.discussionRemaining || 0;
        const m = String(Math.floor(s/60)).padStart(2,'0');
        const sec = String(s%60).padStart(2,'0');
        return `${backRow('5 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">🗣️</div><h2>وقت النقاش العام</h2><p class="lead">الحين كل واحد يدافع عن نفسه ويشكك بالثاني.</p><div id="discussion-timer" class="timer">${m}:${sec}</div><div class="actions two"><button class="btn secondary" data-action="toggle-discussion">${state.round.discussionRunning ? 'وقف المؤقت' : 'كمل المؤقت'}</button><button class="btn primary" data-action="go-voting">ابدأ التصويت</button></div></div>`;
      }
      function startDiscussionTimer() {
        timerHandle = setInterval(() => {
          if (!state.round?.discussionRunning) return;
          state.round.discussionRemaining = Math.max(0, state.round.discussionRemaining - 1);
          const el = document.getElementById('discussion-timer');
          if (el) {
            const s = state.round.discussionRemaining;
            el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            el.classList.toggle('ending', s <= 10);
          }
          if (state.round.discussionRemaining % 5 === 0) saveState();
          if (state.round.discussionRemaining <= 0) {
            state.round.discussionRunning = false; stopTimer(); feedback('big'); toast('خلص وقت النقاش، يلا تصويت'); saveState();
          }
        },1000);
      }

      function voteChoicesFor(voterId) {
        const ids = state.round.voteRestriction || state.players.map(p => p.id);
        return ids.filter(id => state.settings.allowSelfVote || id !== voterId);
      }
      function neededVoteCount(voterId) {
        const choices = voteChoicesFor(voterId).length;
        if (state.round.voteRestriction) return 1;
        if (state.settings.allImposters) return 1;
        return state.settings.voteMode === 'all' ? Math.min(secret.imposterIds.length, choices) : 1;
      }
      function goVoting(revoteCandidates = null) {
        if (!revoteCandidates) state.round.revoteContext = null;
        state.round.votes = {};
        state.round.voterOrder = shuffle(state.players.map(p => p.id));
        state.round.voterIndex = 0;
        state.round.voteStarted = false;
        state.round.currentVote = [];
        state.round.voteRestriction = revoteCandidates;
        state.screen = 'voting';
        saveState(); render();
      }
      function renderVoting() {
        const r = state.round;
        if (!r) return '';
        const voterId = r.voterOrder[r.voterIndex];
        const voter = currentPlayerById(voterId);
        if (!voter) return `<div class="card"><button class="btn primary" data-action="finish-voting">اظهر النتيجة</button></div>`;
        if (!r.voteStarted) {
          return `${backRow('6 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">🗳️</div><h2>عط الجوال لـ ${escapeHtml(voter.name)} عشان يصوت</h2><p class="lead">لا تخلون احد يشوف اختياره.</p><button class="btn primary" style="width:100%" data-action="start-vote">ابدأ التصويت</button></div>`;
        }
        const needed = neededVoteCount(voterId);
        const choices = voteChoicesFor(voterId);
        return `${backRow('6 من 7','locked-back')}<div class="card"><h2>مين برا السالفة؟</h2><p class="lead">${escapeHtml(voter.name)}، اختر ${needed === 1 ? 'شخص واحد' : `${needed} اشخاص`}.</p>
          <div class="vote-grid">${choices.map(id => { const p=currentPlayerById(id); return `<button class="vote-option ${r.currentVote.includes(id) ? 'selected' : ''}" data-vote-option="${id}">${escapeHtml(p.name)}</button>`; }).join('')}</div>
          <div class="hint" style="margin-top:12px">اخترت ${r.currentVote.length} من ${needed}</div>
          <button class="btn primary" style="width:100%;margin-top:14px" data-action="confirm-vote" ${r.currentVote.length === needed ? '' : 'disabled'}>تاكيد واخف التصويت</button></div>`;
      }

      function calculateTally() {
        const tally = Object.fromEntries(state.players.map(p => [p.id,0]));
        Object.values(state.round.votes).forEach(arr => arr.forEach(id => { tally[id] = (tally[id] || 0) + 1; }));
        state.round.finalTally = tally;

        const totalSlots = state.settings.allImposters ? 1 : secret.imposterIds.length;
        const context = state.round.revoteContext;
        const candidateIds = context ? [...context.candidates] : state.players.map(p => p.id);
        const locked = context ? [...context.lockedSuspects] : [];
        const slots = context ? context.slots : totalSlots;
        const sorted = candidateIds.map(id => [id, tally[id] || 0]).sort((a,b) => b[1]-a[1]);
        const cutoff = sorted[Math.min(slots-1, sorted.length-1)]?.[1] ?? 0;
        const above = sorted.filter(([,v]) => v > cutoff).map(([id])=>id);
        const atCutoff = sorted.filter(([,v]) => v === cutoff).map(([id])=>id);
        const tied = atCutoff.length > Math.max(0, slots - above.length) ? atCutoff : [];
        const picked = sorted.slice(0, slots).map(([id])=>id);

        state.round.topSuspects = [...locked, ...picked].slice(0,totalSlots);
        state.round.tieCandidates = tied;
        state.round.detected = !state.settings.allImposters && secret.imposterIds.every(id => state.round.topSuspects.includes(id)) && tied.length === 0;

        if (!context && tied.length) {
          state.round.revoteContext = {
            lockedSuspects: above,
            candidates: tied,
            slots: Math.max(1, totalSlots - above.length)
          };
        } else if (context && tied.length) {
          const nextLocked = [...new Set([...locked, ...above])];
          state.round.revoteContext = {
            lockedSuspects: nextLocked,
            candidates: tied,
            slots: Math.max(1, totalSlots - nextLocked.length)
          };
        } else if (context && !tied.length) {
          state.round.revoteContext = null;
        }
      }

      function finishVoting() {
        calculateTally();
        if (state.round.tieCandidates.length) {
          state.round.tiePending = true;
          state.screen = 'result';
          saveState(); render();
          return;
        }
        state.round.tiePending = false;
        if (state.settings.allImposters) return finalizeResult();
        state.round.guessIndex = 0;
        state.round.guesses = {};
        state.round.guessedCorrectly = false;
        state.screen = 'guess';
        saveState(); render();
      }

      function renderGuess() {
        const r = state.round;
        const ids = secret.imposterIds || [];
        const impId = ids[r.guessIndex];
        if (!impId) { finalizeResult(); return ''; }
        const imp = currentPlayerById(impId);
        const category = getCategory(r.categoryId);
        const options = shuffle([secret.word, ...shuffle(category.words.filter(w => w !== secret.word)).slice(0,3)]);
        return `${backRow('6 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">🎯</div><h2>${escapeHtml(imp.name)} عنده فرصة يخمن الكلمة</h2><p class="lead">اذا جابها صح، فريق الامبوسترات يقدر يقلب النتيجة.</p>
          <div class="vote-grid">${options.map(w => `<button class="vote-option" data-guess-option="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join('')}</div>
          <div class="field" style="margin-top:14px"><label>او اكتب تخمينك</label><input id="manual-guess" class="input" placeholder="اكتب الكلمة هنا" autocomplete="off"></div>
          <div class="actions two"><button class="btn secondary" data-action="skip-guess">ما عندي تخمين</button><button class="btn primary" data-action="submit-guess">ثبت التخمين</button></div></div>`;
      }

      function submitGuess(value) {
        const r = state.round;
        const impId = secret.imposterIds[r.guessIndex];
        const guess = normalizeName(value);
        if (!guess) { toast('اختر كلمة او اكتب تخمين'); feedback('error'); return; }
        const correct = normalizeArabic(guess) === normalizeArabic(secret.word);
        r.guesses[impId] = { guess, correct };
        if (correct) r.guessedCorrectly = true;
        r.guessIndex++;
        feedback(correct ? 'big' : 'tap');
        if (r.guessIndex >= secret.imposterIds.length || correct) finalizeResult();
        else { saveState(); render(); }
      }

      function applyPoints() {
        const r = state.round;
        if (!state.settings.pointsEnabled || r.pointsApplied) return;
        state.players.forEach(p => {
          const isImp = secret.imposterIds.includes(p.id);
          if (isImp) {
            if (!r.detected) p.score += 2;
            if (r.guesses[p.id]?.correct) p.score += 1;
          } else {
            const selected = r.votes[p.id] || [];
            if (selected.some(id => secret.imposterIds.includes(id))) p.score += 1;
          }
        });
        r.pointsApplied = true;
      }

      function finalizeResult() {
        calculateTally();
        if (state.settings.allImposters) state.round.resultWinner = 'chaos';
        else if (!state.round.detected || state.round.guessedCorrectly) state.round.resultWinner = 'imposters';
        else state.round.resultWinner = 'players';
        applyPoints();
        state.screen = 'result';
        saveState(); render(); launchConfetti();
      }

      function renderResult() {
        const r = state.round;
        if (!r) return '';
        const tally = r.finalTally || {};
        const sorted = [...state.players].sort((a,b) => (tally[b.id]||0)-(tally[a.id]||0));
        if (r.tiePending) {
          const tiedNames = r.tieCandidates.map(id => currentPlayerById(id)?.name).filter(Boolean);
          return `${backRow('7 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">⚖️</div><h2>التصويت متعادل</h2><p class="lead">التعادل بين: ${escapeHtml(tiedNames.join('، '))}</p><div class="actions"><button class="btn primary" data-action="revote-tied">اعادة التصويت بين المتعادلين</button><button class="btn secondary" data-action="reveal-tie">اكشف الادوار مباشرة</button></div></div><div class="card"><h3>الاصوات الحالية</h3><table class="score-table"><tbody>${sorted.map(p => `<tr><td>${escapeHtml(p.name)}</td><td><b>${tally[p.id]||0}</b></td></tr>`).join('')}</tbody></table></div>`;
        }
        const impNames = secret.imposterIds.map(id => currentPlayerById(id)?.name).filter(Boolean);
        const bannerClass = r.resultWinner === 'imposters' ? 'win-imposter' : r.resultWinner === 'chaos' ? 'chaos' : '';
        const title = r.resultWinner === 'players' ? 'اللاعبون كشفوا السالفة 🎉' : r.resultWinner === 'imposters' ? 'الامبوستر قلبها عليكم 😎' : 'جولة فوضوية على اصولها 😂';
        const subtitle = r.resultWinner === 'players' ? 'مسكتم الامبوستر وما قدر يخمن الكلمة.' : r.resultWinner === 'imposters' ? (!r.detected ? 'ما قدرتوا تكشفونه.' : 'انكشف، بس خمن الكلمة صح.') : 'كلكم برا السالفة، وما فيه فائز رسمي.';
        return `${backRow('7 من 7','home')}<div class="result-banner ${bannerClass}"><div style="font-size:42px">🏆</div><h2>${title}</h2><p>${subtitle}</p></div>
          <div class="card"><h3>كشف الحقيقة</h3><p><b>${state.settings.allImposters ? 'الادوار:' : 'الامبوستر:'}</b> ${state.settings.allImposters ? 'الجميع كانوا برا السالفة' : escapeHtml(impNames.join('، '))}</p><p><b>التصنيف:</b> ${escapeHtml(r.categoryName)}</p><p><b>الكلمة المخفية:</b> ${escapeHtml(secret.word)}</p></div>
          <div class="card"><h3>نتيجة التصويت</h3><table class="score-table"><thead><tr><th>اللاعب</th><th>الاصوات</th><th>الدور</th></tr></thead><tbody>${sorted.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${tally[p.id]||0}</td><td>${secret.imposterIds.includes(p.id) ? '<span class="badge imposter">امبوستر</span>' : '<span class="badge normal">داخل السالفة</span>'}</td></tr>`).join('')}</tbody></table></div>
          ${state.settings.pointsEnabled ? `<div class="card"><h3>ترتيب النقاط</h3><table class="score-table"><thead><tr><th>اللاعب</th><th>النقاط</th></tr></thead><tbody>${[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<tr><td>${i===0?'🥇 ':''}${escapeHtml(p.name)}</td><td><b>${p.score}</b></td></tr>`).join('')}</tbody></table></div>` : ''}
          <div class="actions"><button class="btn primary" data-action="new-same">جولة جديدة بنفس اللاعبين</button><button class="btn secondary" data-action="change-settings">غير الاعدادات</button><button class="btn secondary" data-action="change-players">غير اللاعبين</button><button class="btn ghost" data-action="home">العودة للرئيسية</button></div>`;
      }

      function launchConfetti() {
        const root = document.getElementById('confetti-root');
        root.innerHTML = `<div class="confetti">${Array.from({length:52},(_,i)=>`<i style="left:${Math.random()*100}%;--d:${1.8+Math.random()*2.2}s;--r:${Math.random()*360}deg;--x:${-80+Math.random()*160}px;--h:${Math.random()*360};animation-delay:${Math.random()*.4}s"></i>`).join('')}</div>`;
        setTimeout(() => root.innerHTML = '', 4300);
      }

      function renderPrivacyShield() {
        const root = document.getElementById('privacy-root');
        if (!state.privacyShield) { root.innerHTML = ''; return; }
        root.innerHTML = `<div class="privacy-shield"><div><div class="privacy-icon">🔒</div><h2>غطينا الشاشة</h2><p class="lead">رجعت للتطبيق؟ تاكد ان الجوال مع الشخص الصح.</p><button class="btn primary" data-action="unlock-privacy">رجعت، كمل</button></div></div>`;
        root.querySelector('[data-action="unlock-privacy"]')?.addEventListener('click', () => {
          state.privacyShield = false;
          if (state.screen === 'roles' && state.round) state.round.roleRevealed = false;
          saveState(); render();
        });
      }

      function bindGlobalActions() {
        document.querySelector('[data-action="toggle-theme"]')?.addEventListener('click', () => {
          state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; feedback(); saveState(); render();
        });
        document.querySelector('[data-action="toggle-sound"]')?.addEventListener('click', () => {
          state.settings.sound = !state.settings.sound; saveState(); render();
        });
      }

      function bindScreenActions() {
        document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => handleAction(btn.dataset.action, btn)));
        document.querySelectorAll('[data-player-input]').forEach(input => {
          input.addEventListener('input', e => {
            const p = currentPlayerById(input.dataset.playerInput); if (p) p.name = e.target.value;
            saveState();
            const next = document.querySelector('[data-action="players-next"]'); if (next) next.disabled = !validPlayers();
          });
          input.addEventListener('blur', () => { const p=currentPlayerById(input.dataset.playerInput); if(p) p.name=normalizeName(p.name); saveState(); render(); });
          input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (state.players.length < MAX_PLAYERS) addPlayer(); } });
        });
        document.querySelectorAll('[data-delete-player]').forEach(btn => btn.addEventListener('click', () => {
          if (state.players.length <= MIN_PLAYERS) return toast('اقل شي لاعبين');
          state.players = state.players.filter(p => p.id !== btn.dataset.deletePlayer); feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-setting]').forEach(input => input.addEventListener('change', () => {
          const key = input.dataset.setting;
          state.settings[key] = input.checked;
          if (key === 'allImposters') { state.settings.imposterCount = 1; state.settings.voteMode = 'one'; }
          feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-setting-select]').forEach(sel => sel.addEventListener('change', () => {
          const key=sel.dataset.settingSelect; state.settings[key] = key === 'discussionMinutes' ? Number(sel.value) : sel.value; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-question-time]').forEach(btn => btn.addEventListener('click', () => { state.settings.questionTimer = Number(btn.dataset.questionTime); feedback(); saveState(); render(); }));
        document.querySelectorAll('[data-category]').forEach(btn => btn.addEventListener('click', () => {
          const id=btn.dataset.category; const set=new Set(state.selectedCategoryIds); set.has(id)?set.delete(id):set.add(id); state.selectedCategoryIds=[...set]; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-vote-option]').forEach(btn => btn.addEventListener('click', () => {
          const id=btn.dataset.voteOption; const needed=neededVoteCount(state.round.voterOrder[state.round.voterIndex]);
          const set=new Set(state.round.currentVote); if(set.has(id)) set.delete(id); else { if(set.size>=needed) set.delete([...set][0]); set.add(id); }
          state.round.currentVote=[...set]; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-guess-option]').forEach(btn => btn.addEventListener('click', () => {
          document.querySelectorAll('[data-guess-option]').forEach(x=>{x.classList.remove('selected');delete x.dataset.chosen;}); btn.classList.add('selected'); btn.dataset.chosen='1'; feedback();
        }));
      }

      function addPlayer() {
        if (state.players.length >= MAX_PLAYERS) return toast('وصلتم للحد الاقصى من اللاعبين');
        state.players.push({ id: makeId(), name: `اللاعب ${state.players.length+1}`, score: 0 });
        feedback(); saveState(); render();
        setTimeout(() => document.querySelectorAll('[data-player-input]')[state.players.length-1]?.focus(), 0);
      }

      function handleAction(action, btn) {
        switch(action) {
          case 'start-game': state.round=null; secret={}; state.screen='players'; feedback('big'); saveState(); render(); break;
          case 'resume-game': state.screen = state.round?.allRolesSeen ? 'questions' : 'roles'; render(); break;
          case 'home':
            if (state.round?.started && state.screen !== 'result') return confirmEnd(() => { state.screen='home'; state.round=null; secret={}; saveState(); render(); });
            if (state.screen === 'result') { state.round=null; secret={}; }
            state.screen='home'; saveState(); render(); break;
          case 'back': if (state.screen==='settings') state.screen='players'; else if(state.screen==='categories') state.screen='settings'; saveState(); render(); break;
          case 'locked-back': confirmEnd(() => { state.round=null; secret={}; state.screen='categories'; saveState(); render(); }); break;
          case 'add-player': addPlayer(); break;
          case 'temp-names': state.players.forEach((p,i)=>p.name=`لاعب ${i+1}`); feedback(); saveState(); render(); break;
          case 'players-next':
            state.players.forEach(p=>p.name=normalizeName(p.name));
            if(!validPlayers()) { feedback('error'); toast(playerErrors()||'تاكد من الاسامي'); return; }
            state.settings.imposterCount=clamp(state.settings.imposterCount,1,maxImposters()); state.screen='settings'; feedback(); saveState(); render(); break;
          case 'imp-minus': state.settings.imposterCount=clamp(state.settings.imposterCount-1,1,maxImposters()); feedback(); saveState(); render(); break;
          case 'imp-plus': state.settings.imposterCount=clamp(state.settings.imposterCount+1,1,maxImposters()); feedback(); saveState(); render(); break;
          case 'reset-scores': showModal({title:'نصفر النقاط؟',body:'<p>كل نقاط الجلسة بتنمسح.</p>',confirmText:'ايه، صفرها',onConfirm:()=>{state.players.forEach(p=>p.score=0);feedback('big');saveState();render();}}); break;
          case 'settings-next':
            if(!state.selectedCategoryIds.length) state.selectedCategoryIds=[sample(allCategories()).id]; state.screen='categories'; feedback(); saveState(); render(); break;
          case 'custom-category': openCustomCategory(); break;
          case 'start-roles': startRound(); break;
          case 'go-categories': state.screen='categories'; render(); break;
          case 'reveal-role': state.round.roleRevealed=true; feedback('big'); saveState(); render(); break;
          case 'hide-role':
            state.round.roleRevealed=false; state.round.roleIndex++;
            if(state.round.roleIndex>=state.round.distributionOrder.length) state.round.allRolesSeen=true;
            feedback(); saveState(); render(); break;
          case 'begin-questions': beginQuestions(false); break;
          case 'next-question':
            const pair=state.round.pairings[state.round.questionIndex]; state.round.usedPairs.push(`${pair.asker}>${pair.target}`); state.round.questionIndex++;
            if(state.round.questionIndex>=state.round.pairings.length) state.round.questionPhase='complete'; feedback(); saveState(); render(); break;
          case 'skip-match': skipCurrentMatch(); break;
          case 'extra-questions': beginQuestions(true); break;
          case 'start-discussion': startDiscussion(); break;
          case 'toggle-discussion': state.round.discussionRunning=!state.round.discussionRunning; feedback(); saveState(); render(); break;
          case 'go-voting': goVoting(); break;
          case 'start-vote': state.round.voteStarted=true; state.round.currentVote=[]; feedback(); saveState(); render(); break;
          case 'confirm-vote':
            const voterId=state.round.voterOrder[state.round.voterIndex]; state.round.votes[voterId]=[...state.round.currentVote]; state.round.voterIndex++; state.round.voteStarted=false; state.round.currentVote=[]; feedback('big');
            if(state.round.voterIndex>=state.round.voterOrder.length) finishVoting(); else {saveState();render();} break;
          case 'finish-voting': finishVoting(); break;
          case 'submit-guess':
            const chosen=document.querySelector('[data-guess-option][data-chosen="1"]')?.textContent?.trim(); const manual=document.getElementById('manual-guess')?.value; submitGuess(manual||chosen||''); break;
          case 'skip-guess': submitGuess('ما ادري'); break;
          case 'revote-tied':
            state.round.tiePending=false;
            goVoting(state.round.revoteContext?.candidates || state.round.tieCandidates);
            break;
          case 'reveal-tie':
            state.round.tiePending=false;
            state.round.tieCandidates=[];
            state.round.revoteContext=null;
            finalizeResult();
            break;
          case 'new-same': state.round=null; secret={}; startRound(); break;
          case 'change-settings': state.round=null; secret={}; state.screen='settings'; saveState(); render(); break;
          case 'change-players': state.round=null; secret={}; state.screen='players'; saveState(); render(); break;
          case 'how-to': openHowTo(); break;
          case 'share': shareGame(); break;
          case 'install': installApp(); break;
        }
      }

      function confirmEnd(onYes) {
        showModal({ title:'متاكد تبي تنهي الجولة؟', body:'<p>اذا رجعت الحين بتروح بيانات الجولة الحالية، لكن النقاط تبقى.</p>', confirmText:'ايه، انه الجولة', cancelText:'لا، كمل', onConfirm:()=>{onYes(); return true;} });
      }
      function openHowTo() {
        showModal({ title:'كيف تلعبون؟', hideCancel:true, body:`<div class="soft-card"><b>1.</b> ضيفوا اللاعبين وحددوا عدد الامبوسترات.</div><div class="soft-card"><b>2.</b> كل لاعب يشوف دوره بسرية. العادي يعرف الكلمة، والامبوستر ما يعرفها.</div><div class="soft-card"><b>3.</b> اسالوا بعض اسئلة ذكية بدون ما تكشفون الكلمة.</div><div class="soft-card"><b>4.</b> صوتوا على اللي تشكون انه برا السالفة.</div><div class="soft-card"><b>5.</b> اذا انكشف الامبوستر، يقدر يفوز لو خمن الكلمة.</div>` });
      }
      function openCustomCategory() {
        showModal({ title:'اضف تصنيفك', confirmText:'اضافة', body:`<div class="field"><label>اسم التصنيف</label><input id="custom-name" class="input" maxlength="30" placeholder="مثلا: اشياء بالدوام"></div><div class="field"><label>الكلمات</label><textarea id="custom-words" placeholder="كل كلمة بسطر، او افصل بينها بفاصلة"></textarea><div class="hint">اقل شي 5 كلمات مختلفة.</div></div>`, onConfirm:(root)=>{
          const name=normalizeName(root.querySelector('#custom-name').value); const raw=root.querySelector('#custom-words').value;
          const words=[...new Set(raw.split(/[،,\n]+/).map(normalizeName).filter(Boolean))];
          if(!name){toast('اكتب اسم التصنيف');return false;} if(words.length<5){toast('حط 5 كلمات على الاقل');return false;}
          const id=`custom_${makeId()}`; state.customCategories.push({id,name,icon:'✨',words}); state.selectedCategoryIds.push(id); feedback('big'); saveState(); render(); return true;
        }});
      }
      async function shareGame() {
        const data={title:'مين برا السالفة؟',text:'يلا نلعب مين برا السالفة؟',url:location.href};
        try { if(navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); toast('نسخنا رابط اللعبة'); } } catch {}
      }
      async function installApp() {
        if(!deferredInstallPrompt){toast('خيار التثبيت يطلع بعد رفع الملف على استضافة تدعم PWA');return;}
        deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null; render();
      }

      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt=e; render(); });
      document.addEventListener('visibilitychange', () => {
        if(document.hidden && state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); }
      });
      window.addEventListener('blur', () => {
        if(state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); renderPrivacyShield(); }
      });
      window.addEventListener('orientationchange', () => {
        if(state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); renderPrivacyShield(); }
      });
      window.addEventListener('keydown', e => {
        if(e.key==='Escape' && document.getElementById('modal-root').innerHTML) document.getElementById('modal-root').innerHTML='';
      });
      if (state.round?.started && state.screen !== 'result') history.pushState({gameGuard:true}, '', location.href);
      window.addEventListener('popstate', () => {
        if (state.round?.started && state.screen !== 'result') {
          history.pushState({gameGuard:true}, '', location.href);
          confirmEnd(() => { state.round=null; secret={}; state.screen='categories'; saveState(); render(); });
        }
      });

      render();
    })();
  </script>
</body>
</html>
